# Local development only. Passwords here are not for production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dickrank
      POSTGRES_PASSWORD: dickrank_dev_only
      POSTGRES_DB: dickrank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dickrank -d dickrank"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dickrank
      MINIO_ROOT_PASSWORD: dickrank_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dickrank dickrank_dev_only &&
      mc mb --ignore-existing local/dickrank-media &&
      mc mb --ignore-existing local/dickrank-backups
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
